openapi: 3.0.3
info:
  title: BeeBase Inspection Service API
  description: >
    Inspection service for BeeBase, an open-source backend for a
    beekeeper management application split into microservices. Access
    tokens are issued by auth-service (see its OpenAPI spec); this
    service verifies them against auth-service's public key and never
    trusts a userID from anywhere but a verified token.

    Every inspection belongs to a hive owned by hive-service, which
    itself belongs to an apiary owned by apiary-service. Creating an
    inspection requires that the caller own the referenced hive; this
    service confirms that by forwarding the caller's own access token to
    hive-service's GET /api/v1/hives/{id} and trusting its answer. Since
    hive-service's own check is itself transitive against apiary-service,
    this single call confirms the whole chain - inspection-service never
    queries hive or apiary ownership itself.

    Photos and other files are uploaded directly to media-service (see its
    OpenAPI spec) independently of any inspection - upload doesn't require
    one to exist yet, and this service never receives file bytes. `images`
    on an inspection is the set of media IDs this service itself stores
    and returns - the source of truth for what's referenced, not a
    media-service round trip - settable via POST (reference immediately on
    creation) or PUT (replace the set wholesale). Every id is verified
    against media-service (a plain ownership check, not a mutating call)
    before being accepted; an id that doesn't exist, was deleted, or
    belongs to a different user is rejected. There's no exclusivity
    between hives/apiaries/inspections - the same media id may be
    referenced by more than one. Removing an id from `images` only drops
    the reference; it does not delete the underlying file (cascading a
    hive delete does delete every file its inspections reference).
  version: 0.8.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: inspections
    description: Create, read, update, and delete a user's own inspections.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      description: Always returns 200 while the process is running. Has no dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      security: []
      description: Returns 200 only if the database is reachable.
      responses:
        "200":
          description: The service is ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/inspections:
    post:
      tags: [inspections]
      summary: Create an inspection under one of the caller's own hives
      description: >
        Rejected with 404 hive_not_found if hive_id doesn't exist or
        doesn't belong to the caller (which also covers its apiary not
        belonging to the caller) — verified live against hive-service,
        not trusted from the request. images, if given, is verified
        against media-service, not trusted from the request. Omitting
        images (or sending an empty array) creates an inspection with no
        photos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInspectionRequest" }
      responses:
        "201":
          description: Inspection created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionResponse" }
        "400":
          description: >
            Request failed validation (including a missing or malformed
            hive_id, inspected_at, or type), media limit reached, or images contains an id
            that doesn't belong to the caller.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ValidationErrorResponse" }
                  - { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >
            hive_id exists and belongs to the caller, but is not currently
            writable under their Free entitlement — either the hive itself
            or its parent apiary requires Pro (code
            parent_resource_pro_locked). Historical inspections under it
            remain fully readable; creating a new one requires the hive to
            become writable again (promotion, or upgrading to Pro).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: hive_id doesn't exist, or belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [inspections]
      summary: List the authenticated user's inspections across every hive
      description: >
        Returns only inspections owned by the caller — never another
        user's — as a page of results, across all of their hives. Omitting
        page/limit falls back to page=1, limit=20. For inspections scoped
        to one hive, see GET /api/v1/hives/{hiveId}/inspections instead.
      parameters:
        - name: page
          in: query
          description: 1-indexed page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Optional search filter (matched case-insensitively against notes). Minimum 3 characters.
          required: false
          schema: { type: string, minLength: 3 }
        - name: type
          in: query
          description: >
            Optional filter restricting results to inspections of this
            type. Combines with search and pagination using AND semantics
            — all specified filters must match. Omitting it leaves results
            unfiltered by type.
          required: false
          schema: { $ref: "#/components/schemas/InspectionType" }
        - name: dateFrom
          in: query
          description: Inclusive lower bound on inspected_at as YYYY-MM-DD.
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: Inclusive upper bound on inspected_at as YYYY-MM-DD; date_from must not be later.
          required: false
          schema: { type: string, format: date }
        - name: sortOrder
          in: query
          description: >
            Optional sort direction. Omitted keeps the endpoint's default
            order (inspected_at ascending, id ascending); when given
            ("asc" or "desc"), results are instead ordered by creation
            date (created_at) — not inspected_at — in that direction, with
            id tied to the same direction as a stable secondary sort.
          required: false
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: A page of the caller's inspections.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InspectionResponse" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: page, limit, search, type, or sortOrder is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/inspections/{inspectionId}:
    parameters:
      - name: inspectionId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [inspections]
      summary: Get one of the authenticated user's inspections
      description: >
        Returns 404 both when inspectionId doesn't exist and when it
        belongs to a different user — the two cases are indistinguishable
        to the caller, by design.
      responses:
        "200":
          description: The inspection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionResponse" }
        "400":
          description: inspectionId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such inspection, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [inspections]
      summary: Replace an inspection's editable fields
      description: >
        Full replacement (PUT semantics), not a partial patch: inspected_at,
        notes are set from the request body. The type field remains accepted
        for compatibility with the released client, but InspectionType is
        immutable after creation: a changed value is ignored and an unchanged
        value succeeds. An inspection can't be moved to a different hive —
        there's no hive_id here.
        images is the one field exempt from full replacement's "always
        set" rule: omitting it (or sending null) leaves the currently
        attached photos untouched, while sending an array (including an
        empty one) replaces the attached set wholesale. The parent hive's
        current writability is re-verified against hive-service on every
        update, not only at creation time — an inspection whose hive has
        since become read-only can no longer be edited, even though it
        remains fully readable.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInspectionRequest" }
      responses:
        "200":
          description: The updated inspection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionResponse" }
        "400":
          description: >
            inspectionId is not a valid UUID, the request failed
            validation, media limit reached, or images contains an id that doesn't belong to
            the caller.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ValidationErrorResponse" }
                  - { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >
            The parent hive is not currently writable under the caller's
            Free entitlement (code parent_resource_pro_locked).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such inspection, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [inspections]
      summary: Delete an inspection
      description: Soft delete — the row is retained (deleted_at is set) for future sync support.
      responses:
        "204":
          description: The inspection is deleted (or already was).
        "400":
          description: inspectionId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such inspection, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/hives/{hiveId}/inspections:
    parameters:
      - name: hiveId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [inspections]
      summary: List the authenticated user's inspections for one hive
      description: >
        Returns only inspections the caller owns for this hive, as a page
        of results. If hiveId belongs to a different user (or doesn't
        exist), the result is an empty page, not an error — the caller
        simply has no inspections there, which reveals nothing about
        hiveId itself. Omitting page/limit falls back to page=1, limit=20.
      parameters:
        - name: page
          in: query
          description: 1-indexed page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: search
          in: query
          description: Optional search filter (matched case-insensitively against notes). Minimum 3 characters.
          required: false
          schema: { type: string, minLength: 3 }
        - name: type
          in: query
          description: >
            Optional filter restricting results to inspections of this
            type. Combines with search and pagination using AND semantics
            — all specified filters must match. Omitting it leaves results
            unfiltered by type.
          required: false
          schema: { $ref: "#/components/schemas/InspectionType" }
        - name: dateFrom
          in: query
          description: >
            Optional inclusive lower bound on inspected_at, as an ISO 8601
            calendar date (YYYY-MM-DD, no time-of-day). Matches the whole
            of that calendar day onward. Independent of date_to - each may
            be given alone - but when both are given, date_from must not
            fall after date_to. Combines with search/type/pagination using
            AND semantics.
          required: false
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          description: >
            Optional inclusive upper bound on inspected_at, as an ISO 8601
            calendar date (YYYY-MM-DD, no time-of-day). Matches the whole
            of that calendar day, through its last instant. Independent of
            date_from - each may be given alone - but when both are given,
            date_from must not fall after date_to. Combines with
            search/type/pagination using AND semantics.
          required: false
          schema: { type: string, format: date }
        - name: sortOrder
          in: query
          description: >
            Optional sort direction. Omitted keeps the endpoint's default
            order (inspected_at ascending, id ascending); when given
            ("asc" or "desc"), results are instead ordered by creation
            date (created_at) — not inspected_at — in that direction, with
            id tied to the same direction as a stable secondary sort.
          required: false
          schema: { type: string, enum: [asc, desc] }
      responses:
        "200":
          description: A page of the caller's inspections for this hive.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InspectionResponse" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: >
            hiveId is not a valid UUID, or page, limit, search, type,
            date_from, date_to, or sortOrder is invalid - including
            date_from/date_to not matching YYYY-MM-DD, or date_from
            falling after date_to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/hives/{hiveId}/health:
    parameters:
      - name: hiveId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [inspections]
      summary: Get the calculated Colony Health snapshot for one hive
      description: >
        Returns a derived, non-persisted Colony Health snapshot calculated
        from the caller's complete structured inspection history for this
        hive. The top-level state is the calculated aggregate; the OVERALL
        dimension remains the beekeeper's separate broad assessment and is
        not included in the aggregate calculation. A hive with no usable
        structured evidence returns UNKNOWN with NONE coverage.
      responses:
        "200":
          description: The calculated Colony Health snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ColonyHealthResponse" }
        "400":
          description: hiveId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: The hive does not exist or is not accessible to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/hives/{hiveId}/health/history:
    parameters:
      - name: hiveId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [inspections]
      summary: Get the calculated Colony Health history for one hive (Pro only)
      description: >
        Returns one derived, non-persisted Colony Health v1 snapshot per
        calendar day in the inclusive [from, to] range, plus every
        inspection that occurred within that same range. Each day's
        snapshot reflects only inspections dated on or before that day —
        a future inspection can never change an earlier day's point — and
        same-day evidence is always co-equal (there is no time-of-day
        ordering within a calendar day). This endpoint is Pro-only; GET
        .../health above remains available to every caller regardless of
        entitlement and is unaffected by this gate.


        UNKNOWN is not a fourth severity level below CONCERN: it means
        there was insufficient usable health evidence as of that date to
        calculate a state at all, and always pairs with NONE coverage. A
        client should render it as a gap/no-data point in a history
        graph, never as worse than CONCERN. There is no numeric health
        score anywhere in this response; any score shown to a user is a
        presentation-layer concern computed client-side, not part of this
        API contract.


        Ownership is verified before entitlement is checked: a hiveId
        that doesn't exist, or belongs to a different user, is reported
        as 404 — the same non-disclosure convention every other endpoint
        here follows — regardless of the caller's own entitlement. Only
        once ownership is confirmed is the caller's subscription
        entitlement checked; an owner on the Free plan gets 403
        health_history_pro_required. This is distinct from
        parent_resource_pro_locked, which gates write access to a hive
        that itself currently falls outside Free — an unrelated concept
        from read access to that hive's health history.
      parameters:
        - name: from
          in: query
          required: true
          description: >
            Inclusive lower bound of the requested range, as an ISO 8601
            calendar date (YYYY-MM-DD) — a date only, never a timestamp
            or offset.
          schema: { type: string, format: date }
          example: "2026-09-01"
        - name: to
          in: query
          required: true
          description: >
            Inclusive upper bound of the requested range, as an ISO 8601
            calendar date (YYYY-MM-DD) — a date only, never a timestamp
            or offset. Must not fall before from, and the inclusive
            [from, to] range may span at most 365 calendar days.
          schema: { type: string, format: date }
          example: "2026-09-30"
        - name: interval
          in: query
          required: false
          description: >
            Optional. "day" is currently the only supported value — v1
            calculates exactly one point per calendar day — and matched
            case-insensitively when given ("day", "DAY", and "Day" are
            all accepted); any other value is rejected. Omitting the
            parameter entirely is equivalent to sending "day". This is
            independent of the response's own "interval" field, which is
            always the fixed literal "DAY" regardless of the request's
            casing.
          schema: { type: string, enum: [day], default: day }
          example: day
      responses:
        "200":
          description: >
            One Colony Health v1 point per calendar day in the requested
            range, plus every inspection marker in that same range.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HiveHealthHistoryResponse" }
              example:
                algorithmVersion: v1
                from: "2026-09-18"
                to: "2026-09-21"
                interval: DAY
                points:
                  - date: "2026-09-18"
                    state: GOOD
                    coverage: HIGH
                    dimensions:
                      - { dimension: STRENGTH, state: GOOD, coverage: HIGH }
                      - { dimension: QUEEN, state: GOOD, coverage: HIGH }
                      - { dimension: BROOD, state: GOOD, coverage: MEDIUM }
                      - { dimension: NUTRITION, state: GOOD, coverage: HIGH }
                      - { dimension: PESTS_AND_DISEASE, state: GOOD, coverage: MEDIUM }
                      - { dimension: OVERALL, state: GOOD, coverage: MEDIUM }
                  - date: "2026-09-19"
                    state: WATCH
                    coverage: HIGH
                    dimensions:
                      - { dimension: STRENGTH, state: GOOD, coverage: HIGH }
                      - { dimension: QUEEN, state: WATCH, coverage: HIGH }
                      - { dimension: BROOD, state: GOOD, coverage: MEDIUM }
                      - { dimension: NUTRITION, state: GOOD, coverage: HIGH }
                      - { dimension: PESTS_AND_DISEASE, state: GOOD, coverage: MEDIUM }
                      - { dimension: OVERALL, state: WATCH, coverage: MEDIUM }
                  - date: "2026-09-20"
                    state: UNKNOWN
                    coverage: NONE
                    dimensions:
                      - { dimension: STRENGTH, state: UNKNOWN, coverage: NONE }
                      - { dimension: QUEEN, state: UNKNOWN, coverage: NONE }
                      - { dimension: BROOD, state: UNKNOWN, coverage: NONE }
                      - { dimension: NUTRITION, state: UNKNOWN, coverage: NONE }
                      - { dimension: PESTS_AND_DISEASE, state: UNKNOWN, coverage: NONE }
                      - { dimension: OVERALL, state: UNKNOWN, coverage: NONE }
                  - date: "2026-09-21"
                    state: CONCERN
                    coverage: HIGH
                    dimensions:
                      - { dimension: STRENGTH, state: GOOD, coverage: HIGH }
                      - { dimension: QUEEN, state: GOOD, coverage: HIGH }
                      - { dimension: BROOD, state: GOOD, coverage: MEDIUM }
                      - { dimension: NUTRITION, state: GOOD, coverage: HIGH }
                      - { dimension: PESTS_AND_DISEASE, state: CONCERN, coverage: MEDIUM }
                      - { dimension: OVERALL, state: CONCERN, coverage: MEDIUM }
                inspections:
                  - { id: "8f14e45f-ceea-4b3e-8a1d-111111111111", date: "2026-09-18", type: ROUTINE }
                  - { id: "8f14e45f-ceea-4b3e-8a1d-222222222222", date: "2026-09-19", type: QUEEN }
                  - { id: "8f14e45f-ceea-4b3e-8a1d-333333333333", date: "2026-09-21", type: HEALTH }
        "400":
          description: >
            hiveId is not a valid UUID (ErrorResponse, code
            invalid_hive_id), or the query failed validation
            (ValidationErrorResponse): from/to missing or not a
            well-formed YYYY-MM-DD date, from falling after to, the
            inclusive range exceeding 365 days, or an unsupported
            interval value.
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: "#/components/schemas/ValidationErrorResponse" }
                  - { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403":
          description: >
            The caller owns hiveId but their current subscription
            entitlement is Free (code health_history_pro_required).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: hiveId does not exist, or belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by auth-service's /api/v1/auth/login (or /register or /refresh).

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    InspectionType:
      type: string
      description: >
        The kind of inspection performed. Closed set - adding a new value
        is a server-side change, not something a client can send freely.
      enum: [ROUTINE, QUEEN, BROOD, HEALTH, FEEDING, SEASONAL]

    RoutineAssessment:
      type: object
      description: Optional versioned structured observations for ROUTINE inspections. Omitted fields mean no answer, not a negative observation.
      properties:
        version: { type: integer, enum: [1], default: 1 }
        colonyStrength: { type: string, enum: [WEAK, MODERATE, STRONG] }
        queenStatus: { type: string, enum: [HEALTHY, PROBLEM, NOT_CHECKED] }
        broodStatus: { type: string, enum: [HEALTHY, PROBLEM, NOT_CHECKED] }
        foodStores: { type: string, enum: [LOW, ADEQUATE, ABUNDANT, NOT_CHECKED] }
        healthConcerns: { type: string, enum: [NONE, PRESENT, NOT_CHECKED] }

    QueenAssessment:
      type: object
      description: Optional versioned structured observations for QUEEN inspections. Omitted fields mean no observation.
      properties:
        version: { type: integer, enum: [1], default: 1 }
        queenObserved: { type: string, enum: [OBSERVED, NOT_OBSERVED, UNSURE] }
        eggsObserved: { type: string, enum: [YES, NO, UNSURE] }
        queenCells: { type: string, enum: [NONE, PRESENT, UNSURE] }
        queenCondition: { type: string, enum: [NORMAL, CONCERN] }

    BroodAssessment:
      type: object
      description: Optional versioned structured observations for BROOD inspections. Omitted fields mean not assessed; an empty broodStages array means assessed and no stages were observed.
      properties:
        version: { type: integer, enum: [1], default: 1 }
        broodAmount: { type: string, enum: [LOW, MODERATE, HIGH] }
        broodPattern: { type: string, enum: [SOLID, MIXED, SPOTTY] }
        broodStages:
          type: array
          items: { type: string, enum: [EGGS, LARVAE, CAPPED] }
          uniqueItems: true
        broodConcerns: { type: string, enum: [NONE, OBSERVED, UNSURE] }

    HealthAssessment:
      type: object
      description: Optional versioned health observations for HEALTH inspections. These values record observations and beekeeper concern, not diagnoses. Omitted fields mean not assessed; an empty array means assessed and no signs were observed.
      properties:
        version: { type: integer, enum: [1], default: 1 }
        healthOverallCondition: { type: string, enum: [GOOD, FAIR, POOR] }
        pestSigns:
          type: array
          items: { type: string, enum: [VARROA_MITES, WAX_MOTH, SMALL_HIVE_BEETLE, OTHER] }
          uniqueItems: true
        healthWarningSigns:
          type: array
          items: { type: string, enum: [ABNORMAL_BROOD, DEFORMED_WINGS, UNUSUAL_BEE_MORTALITY, DIARRHEA_SIGNS, OTHER] }
          uniqueItems: true
        healthConcernLevel: { type: string, enum: [NONE, LOW, MODERATE, HIGH] }

    FeedingAssessment:
      type: object
      description: Optional versioned observations and actions for FEEDING inspections. Food stores describe colony state; feedingPerformed describes beekeeper action.
      properties:
        version: { type: integer, enum: [1], default: 1 }
        foodStores: { type: string, enum: [LOW, ADEQUATE, ABUNDANT, NOT_CHECKED] }
        feedingNeed: { type: string, enum: [NO, SOON, YES, UNSURE] }
        feedingPerformed: { type: string, enum: [YES, NO] }
        feedTypes:
          type: array
          items: { type: string, enum: [SUGAR_SYRUP, FONDANT, DRY_SUGAR, POLLEN_SUBSTITUTE, OTHER] }
          uniqueItems: true

    SeasonalAssessment:
      type: object
      description: Optional versioned seasonal context, observations, and beekeeper readiness assessment. Season is explicitly selected and is not inferred from date or location; seasonalConcerns omits assessment when null and records no concerns when empty.
      properties:
        version: { type: integer, enum: [1], default: 1 }
        season: { type: string, enum: [SPRING, SUMMER, AUTUMN, WINTER] }
        colonyStrength: { type: string, enum: [WEAK, MODERATE, STRONG] }
        seasonalStoreReadiness: { type: string, enum: [SUFFICIENT, MARGINAL, INSUFFICIENT] }
        seasonalReadiness: { type: string, enum: [READY, NEEDS_ATTENTION, NOT_READY, UNSURE] }
        seasonalConcerns:
          type: array
          items: { type: string, enum: [FOOD_STORES, COLONY_STRENGTH, QUEEN, BROOD, PESTS_OR_DISEASE, HIVE_CONDITION, OTHER] }
          uniqueItems: true

    InspectionAssessment:
      oneOf:
        - $ref: "#/components/schemas/RoutineAssessment"
        - $ref: "#/components/schemas/QueenAssessment"
        - $ref: "#/components/schemas/BroodAssessment"
        - $ref: "#/components/schemas/HealthAssessment"
        - $ref: "#/components/schemas/FeedingAssessment"
        - $ref: "#/components/schemas/SeasonalAssessment"

    CreateInspectionRequest:
      type: object
      required: [hiveId, inspectedAt, notes, type]
      properties:
        hiveId: { type: string, format: uuid, description: Must be a hive owned by the caller. }
        inspectedAt: { type: string, format: date-time, description: When the inspection took place (RFC 3339). }
        notes: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/InspectionType" }
        images:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: >
            Media IDs (returned by media-service's upload endpoint) to
            reference immediately. Each must belong to the caller; omit
            this field (or send an empty array) to create an inspection
            with no photos. Maximum 5 photos allowed.
        assessment: { $ref: "#/components/schemas/InspectionAssessment" }

    UpdateInspectionRequest:
      type: object
      required: [inspectedAt, notes, type]
      properties:
        inspectedAt: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/InspectionType" }
        images:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
          description: >
            The desired final set of media IDs (returned by media-service's
            upload endpoint) referenced by this inspection. Omit this
            field (or send null) to leave the current set untouched; send
            an array (including an empty one) to replace it wholesale.
            Each id must belong to the caller. Maximum 5 photos allowed.
            Dropping an id only removes the reference - it does not delete
            the underlying file.
        assessment: { $ref: "#/components/schemas/InspectionAssessment" }

    InspectionImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        imageUrl:
          type: string
          format: uri
          description: >
            The authenticated URL to fetch or display this image's
            content from (media-service's GET /media/{id}/download,
            reverse-proxied by the gateway). Built fresh on every
            response - if the underlying file ever changes, this URL's
            id stays the same but its content does not, so clients
            should not cache a fetched image keyed only by this URL
            without also checking for staleness.

    InspectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        hiveId: { type: string, format: uuid }
        inspectedAt: { type: string, format: date-time }
        notes: { type: string }
        type: { $ref: "#/components/schemas/InspectionType" }
        typeLabel:
          type: string
          description: Human-readable label for "type" (e.g. "Routine"), derived server-side.
          example: Routine
        images:
          type: array
          items: { $ref: "#/components/schemas/InspectionImage" }
          description: The media currently attached to this inspection, in reference order.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        assessment: { $ref: "#/components/schemas/InspectionAssessment" }

    ColonyHealthResponse:
      type: object
      description: Derived Colony Health; this result is not persisted.
      required: [asOf, state, coverage, dimensions]
      properties:
        asOf: { type: string, format: date-time }
        state: { $ref: "#/components/schemas/DimensionState" }
        coverage: { $ref: "#/components/schemas/EvidenceCoverage" }
        dimensions:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: "#/components/schemas/ColonyHealthDimension" }

    ColonyHealthDimension:
      type: object
      required: [dimension, state, coverage]
      properties:
        dimension:
          type: string
          enum: [STRENGTH, QUEEN, BROOD, NUTRITION, PESTS_AND_DISEASE, OVERALL]
        state: { $ref: "#/components/schemas/DimensionState" }
        coverage: { $ref: "#/components/schemas/EvidenceCoverage" }

    DimensionState:
      type: string
      enum: [UNKNOWN, GOOD, WATCH, CONCERN]

    EvidenceCoverage:
      type: string
      enum: [NONE, LOW, MEDIUM, HIGH]

    HiveHealthHistoryPoint:
      type: object
      description: >
        One calendar day's Colony Health v1 snapshot, calculated as of
        that day's calendar-date boundary. Deliberately mirrors
        ColonyHealthResponse's own state/coverage/dimensions shape (this
        is the same calculation, evaluated at a fixed past date instead
        of "now") — dimensions reuses ColonyHealthDimension rather than a
        separate schema, since the two are serialized identically.
        OVERALL is not omitted from dimensions: it is included as
        explanatory evidence, exactly as GetHiveHealth's response always
        includes it, and remains excluded from the aggregate "state".
      required: [date, state, coverage, dimensions]
      properties:
        date: { type: string, format: date, example: "2026-09-20" }
        state: { $ref: "#/components/schemas/DimensionState" }
        coverage: { $ref: "#/components/schemas/EvidenceCoverage" }
        dimensions:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: "#/components/schemas/ColonyHealthDimension" }

    HiveHealthHistoryInspection:
      type: object
      description: >
        A compact marker for one inspection that occurred within the
        requested history range — enough for a client to open it (GET
        /api/v1/inspections/{id}), never a full inspection payload.
        Carries only id/date/type: no createdAt, no inspectedAt
        timestamp, no assessment payload, and no intra-day ordering
        field, since same-day evidence is always co-equal.
      required: [id, date, type]
      properties:
        id: { type: string, format: uuid }
        date:
          type: string
          format: date
          description: The inspection's calendar date (calendar-date-only, no time-of-day).
        type: { $ref: "#/components/schemas/InspectionType" }

    HiveHealthHistoryResponse:
      type: object
      description: >
        The public representation of GET
        /api/v1/hives/{hiveId}/health/history: one point per calendar day
        in the inclusive [from, to] range, plus every inspection that
        occurred in that same range. "points" always contains at least
        one entry (the range is inclusive and validated to be
        non-empty); "inspections" is always a JSON array, never null or
        omitted, and may be empty ([]) when no inspection falls in range.
      required: [algorithmVersion, from, to, interval, points, inspections]
      properties:
        algorithmVersion:
          type: string
          description: The Colony Health algorithm version every point in this response was calculated with.
          example: v1
        from:
          type: string
          format: date
          description: Echoes the request's "from", normalized to YYYY-MM-DD.
          example: "2026-09-01"
        to:
          type: string
          format: date
          description: Echoes the request's "to", normalized to YYYY-MM-DD.
          example: "2026-09-30"
        interval:
          type: string
          enum: [DAY]
          description: >
            Always the fixed literal "DAY", regardless of the casing the
            request's own "interval" query parameter was sent with (or
            whether it was sent at all).
          example: DAY
        points:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/HiveHealthHistoryPoint" }
        inspections:
          type: array
          items: { $ref: "#/components/schemas/HiveHealthHistoryInspection" }

    Pagination:
      type: object
      description: Metadata describing the requested page relative to the full result set.
      required: [page, limit, total, totalPages, hasNext, hasPrevious]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, description: Total matching rows across all pages., example: 125 }
        totalPages: { type: integer, example: 7 }
        hasNext: { type: boolean }
        hasPrevious: { type: boolean }

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - inspection_not_found
                - hive_not_found
                - invalid_inspection_id
                - invalid_hive_id
                - missing_authorization
                - invalid_access_token
                - invalid_body
                - internal_error
                - media_limit_reached
                - parent_resource_pro_locked
                - health_history_pro_required
              example: inspection_not_found
            message: { type: string, example: inspection not found }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: >
                Field name to error code. Each value is a stable key (not a
                human-readable message) meant to be localized client-side.
                "images" carries "images_invalid" when an entry isn't a
                well-formed UUID, or "image_not_found" when an entry is a
                valid UUID that doesn't belong to the caller.
              additionalProperties:
                type: string
                enum:
                  - hive_id_required
                  - hive_id_invalid
                  - inspected_at_required
                  - inspected_at_invalid
                  - notes_required
                  - notes_too_long
                  - type_required
                  - type_invalid
                  - images_invalid
                  - image_not_found
                  - invalid_page
                  - invalid_limit
                  - invalid_search
                  - invalid_date_from
                  - invalid_date_to
                  - invalid_date_range
                  - invalid_sort_order
                  - from_required
                  - from_invalid
                  - to_required
                  - to_invalid
                  - from_after_to
                  - history_range_too_long
                  - interval_unsupported
              example: { hive_id: "hive_id_invalid" }
