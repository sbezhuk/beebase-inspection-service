openapi: 3.0.3
info:
  title: BeeBase Inspection Service API
  description: >
    Inspection service for BeeBase, an open-source backend for a
    beekeeper management application split into microservices. Access
    tokens are issued by auth-service (see its OpenAPI spec); this
    service verifies them against auth-service's public key and never
    trusts a userID from anywhere but a verified token.

    Every inspection belongs to a hive owned by hive-service, which
    itself belongs to an apiary owned by apiary-service. Creating an
    inspection requires that the caller own the referenced hive; this
    service confirms that by forwarding the caller's own access token to
    hive-service's GET /api/v1/hives/{id} and trusting its answer. Since
    hive-service's own check is itself transitive against apiary-service,
    this single call confirms the whole chain - inspection-service never
    queries hive or apiary ownership itself.

    Photos and other files are uploaded directly to media-service (see its
    OpenAPI spec) independently of any inspection - upload doesn't require
    one to exist yet, and this service never receives file bytes. `images`
    on an inspection is the set of media IDs this service itself stores
    and returns - the source of truth for what's referenced, not a
    media-service round trip - settable via POST (reference immediately on
    creation) or PUT (replace the set wholesale). Every id is verified
    against media-service (a plain ownership check, not a mutating call)
    before being accepted; an id that doesn't exist, was deleted, or
    belongs to a different user is rejected. There's no exclusivity
    between hives/apiaries/inspections - the same media id may be
    referenced by more than one. Removing an id from `images` only drops
    the reference; it does not delete the underlying file (cascading a
    hive delete does delete every file its inspections reference).
  version: 0.1.0
servers:
  - url: http://localhost:8080

tags:
  - name: system
    description: Liveness and readiness probes.
  - name: inspections
    description: Create, read, update, and delete a user's own inspections.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness probe
      security: []
      description: Always returns 200 while the process is running. Has no dependencies.
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /ready:
    get:
      tags: [system]
      summary: Readiness probe
      security: []
      description: Returns 200 only if the database is reachable.
      responses:
        "200":
          description: The service is ready to receive traffic.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }
        "503":
          description: A dependency (the database) is unreachable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StatusResponse" }

  /api/v1/inspections:
    post:
      tags: [inspections]
      summary: Create an inspection under one of the caller's own hives
      description: >
        Rejected with 404 hive_not_found if hive_id doesn't exist or
        doesn't belong to the caller (which also covers its apiary not
        belonging to the caller) — verified live against hive-service,
        not trusted from the request. images, if given, is verified
        against media-service, not trusted from the request. Omitting
        images (or sending an empty array) creates an inspection with no
        photos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateInspectionRequest" }
      responses:
        "201":
          description: Inspection created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionResponse" }
        "400":
          description: >
            Request failed validation (including a missing or malformed
            hive_id, inspected_at, or type), or images contains an id
            that doesn't belong to the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: hive_id doesn't exist, or belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    get:
      tags: [inspections]
      summary: List the authenticated user's inspections across every hive
      description: >
        Returns only inspections owned by the caller — never another
        user's — as a page of results, across all of their hives. Omitting
        page/limit falls back to page=1, limit=20. For inspections scoped
        to one hive, see GET /api/v1/hives/{hiveId}/inspections instead.
      parameters:
        - name: page
          in: query
          description: 1-indexed page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of the caller's inspections.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InspectionResponse" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: page or limit is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/inspections/{inspectionId}:
    parameters:
      - name: inspectionId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [inspections]
      summary: Get one of the authenticated user's inspections
      description: >
        Returns 404 both when inspectionId doesn't exist and when it
        belongs to a different user — the two cases are indistinguishable
        to the caller, by design.
      responses:
        "200":
          description: The inspection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionResponse" }
        "400":
          description: inspectionId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such inspection, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    put:
      tags: [inspections]
      summary: Replace an inspection's editable fields
      description: >
        Full replacement (PUT semantics), not a partial patch: inspected_at,
        notes, and type are all set from the request body. An inspection
        can't be moved to a different hive — there's no hive_id here.
        images is the one field exempt from full replacement's "always
        set" rule: omitting it (or sending null) leaves the currently
        attached photos untouched, while sending an array (including an
        empty one) replaces the attached set wholesale.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateInspectionRequest" }
      responses:
        "200":
          description: The updated inspection.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InspectionResponse" }
        "400":
          description: >
            inspectionId is not a valid UUID, the request failed
            validation, or images contains an id that doesn't belong to
            the caller.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such inspection, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

    delete:
      tags: [inspections]
      summary: Delete an inspection
      description: Soft delete — the row is retained (deleted_at is set) for future sync support.
      responses:
        "204":
          description: The inspection is deleted (or already was).
        "400":
          description: inspectionId is not a valid UUID.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: No such inspection, or it belongs to a different user.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/hives/{hiveId}/inspections:
    parameters:
      - name: hiveId
        in: path
        required: true
        schema: { type: string, format: uuid }

    get:
      tags: [inspections]
      summary: List the authenticated user's inspections for one hive
      description: >
        Returns only inspections the caller owns for this hive, as a page
        of results. If hiveId belongs to a different user (or doesn't
        exist), the result is an empty page, not an error — the caller
        simply has no inspections there, which reveals nothing about
        hiveId itself. Omitting page/limit falls back to page=1, limit=20.
      parameters:
        - name: page
          in: query
          description: 1-indexed page number.
          schema: { type: integer, minimum: 1, default: 1 }
        - name: limit
          in: query
          description: Rows per page.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        "200":
          description: A page of the caller's inspections for this hive.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InspectionResponse" }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "400":
          description: hiveId is not a valid UUID, or page or limit is invalid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ValidationErrorResponse" }
        "401":
          description: Missing, invalid, or expired access token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: An access token issued by auth-service's /api/v1/auth/login (or /register or /refresh).

  schemas:
    StatusResponse:
      type: object
      properties:
        status: { type: string, example: ok }

    InspectionType:
      type: string
      description: >
        The kind of inspection performed. Closed set - adding a new value
        is a server-side change, not something a client can send freely.
      enum: [ROUTINE, QUEEN, BROOD, HEALTH, FEEDING, SEASONAL]

    CreateInspectionRequest:
      type: object
      required: [hive_id, inspected_at, notes, type]
      properties:
        hive_id: { type: string, format: uuid, description: Must be a hive owned by the caller. }
        inspected_at: { type: string, format: date-time, description: When the inspection took place (RFC 3339). }
        notes: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/InspectionType" }
        images:
          type: array
          items: { type: string, format: uuid }
          description: >
            Media IDs (returned by media-service's upload endpoint) to
            reference immediately. Each must belong to the caller; omit
            this field (or send an empty array) to create an inspection
            with no photos.

    UpdateInspectionRequest:
      type: object
      required: [inspected_at, notes, type]
      properties:
        inspected_at: { type: string, format: date-time }
        notes: { type: string, maxLength: 2000 }
        type: { $ref: "#/components/schemas/InspectionType" }
        images:
          type: array
          items: { type: string, format: uuid }
          description: >
            The desired final set of media IDs (returned by media-service's
            upload endpoint) referenced by this inspection. Omit this
            field (or send null) to leave the current set untouched; send
            an array (including an empty one) to replace it wholesale.
            Each id must belong to the caller. Dropping an id only removes
            the reference - it does not delete the underlying file.

    InspectionImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        image_url:
          type: string
          format: uri
          description: >
            The authenticated URL to fetch or display this image's
            content from (media-service's GET /media/{id}/download,
            reverse-proxied by the gateway). Built fresh on every
            response - if the underlying file ever changes, this URL's
            id stays the same but its content does not, so clients
            should not cache a fetched image keyed only by this URL
            without also checking for staleness.

    InspectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        hive_id: { type: string, format: uuid }
        inspected_at: { type: string, format: date-time }
        notes: { type: string }
        type: { $ref: "#/components/schemas/InspectionType" }
        type_label:
          type: string
          description: Human-readable label for "type" (e.g. "Routine"), derived server-side.
          example: Routine
        images:
          type: array
          items: { $ref: "#/components/schemas/InspectionImage" }
          description: The media currently attached to this inspection, in reference order.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Pagination:
      type: object
      description: Metadata describing the requested page relative to the full result set.
      required: [page, limit, total, total_pages, has_next, has_previous]
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 20 }
        total: { type: integer, description: Total matching rows across all pages., example: 125 }
        total_pages: { type: integer, example: 7 }
        has_next: { type: boolean }
        has_previous: { type: boolean }

    ErrorResponse:
      type: object
      description: >
        "code" is the stable, machine-readable key: build any localized
        message off of it, not off "message" (an English fallback for logs
        and manual debugging, not meant to be shown to end users).
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - inspection_not_found
                - hive_not_found
                - invalid_inspection_id
                - invalid_hive_id
                - missing_authorization
                - invalid_access_token
                - invalid_body
                - internal_error
              example: inspection_not_found
            message: { type: string, example: inspection not found }

    ValidationErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [validation_error] }
            message: { type: string, example: request validation failed }
            fields:
              type: object
              description: >
                Field name to error code. Each value is a stable key (not a
                human-readable message) meant to be localized client-side.
                "images" carries "images_invalid" when an entry isn't a
                well-formed UUID, or "image_not_found" when an entry is a
                valid UUID that doesn't belong to the caller.
              additionalProperties:
                type: string
                enum:
                  - hive_id_required
                  - hive_id_invalid
                  - inspected_at_required
                  - inspected_at_invalid
                  - notes_required
                  - notes_too_long
                  - type_required
                  - type_invalid
                  - images_invalid
                  - image_not_found
                  - invalid_page
                  - invalid_limit
              example: { hive_id: "hive_id_invalid" }
